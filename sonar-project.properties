sonar.projectKey=fiaro-app_web
sonar.organization=fiaro-app
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,.next/**,docs/**
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# /design-system es un catálogo solo de desarrollo (404 en producción): no se prueba ni cuenta como duplicación.
sonar.coverage.exclusions=src/app/design-system/**
sonar.cpd.exclusions=src/app/design-system/**
