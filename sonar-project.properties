sonar.projectKey=fiaro-app_web
sonar.organization=fiaro-app
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,.next/**,docs/**
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# icon.tsx y opengraph-image.tsx solo generan imágenes con next/og (se verifican en el build).
# src/content solo guarda textos (los paneles laterales repiten la forma título/pasos/consejo, no lógica).
# /design-system es un catálogo solo de desarrollo (404 en producción): no se prueba ni cuenta como duplicación.
sonar.coverage.exclusions=src/app/design-system/**,src/app/icon.tsx,src/app/opengraph-image.tsx
sonar.cpd.exclusions=src/app/design-system/**,src/content/**
