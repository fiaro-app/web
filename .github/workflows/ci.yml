name: CI

# Solo en PRs: correr otra vez al fusionar en dev repetía lo mismo y duplicaba los minutos. Un cambio
# que solo toca documentación no corre el CI, y un push nuevo cancela la corrida anterior del mismo PR.
on:
  pull_request:
    branches: [dev, main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # `packages: read` deja que el GITHUB_TOKEN automático descargue @fiaro-app/contracts de GitHub
    # Packages; el paquete debe dar acceso de lectura a este repo (ver README, "Contratos").
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for Sonar blame/history analysis

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fiaro-app'

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests with coverage
        run: pnpm run test:cov

      - name: Build
        run: pnpm run build

      # La documentación solo se publica como artefacto en los PRs de release a main.
      - name: Generate docs
        if: github.base_ref == 'main'
        run: pnpm run docs

      - name: Upload docs artifact
        if: github.base_ref == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs
          retention-days: 14

      # El scanner de Sonar descarga su JRE y sus analizadores en cada corrida (~300 MB): se guardan entre corridas.
      - name: Cache Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      # Requires the SONAR_TOKEN repo secret and Automatic Analysis disabled in Sonar
      # (Administration -> Analysis Method -> keep only CI-based Analysis).
      - name: SonarQube Cloud scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
